<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            name="password"
            minlength="8"
            required
        >

        <br><br>

        <button type="submit">Register</button>

    </form>



<body>

    <h1>Accessible Contact Form</h1>

    <form>

        <fieldset>

            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input 
                type="text" 
                id="fullname" 
                name="fullname"
                required
                aria-required="true"
            >

            <br><br>

            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email"
                required
                aria-required="true"
            >

        </fieldset>

        <br>

        <fieldset>

            <legend>Message</legend>

            <label for="message">Your Message:</label>
            <br>

            <textarea
                id="message"
                name="message"
                rows="5"
                cols="30"
                required
                aria-required="true"
                aria-describedby="message-help"
            ></textarea>

            <p id="message-help">
                Fadlan hakan so buuxi.
            </p>

        </fieldset>

        <br>

        <button type="submit">Send</button>

    </form>

</body>

    <h1>Website Feedback Form</h1>

    <p>Please share your experience with our website.</p>

    <form>

        <fieldset>

            <legend>Personal Information</legend>

            <label for="name">Full Name:</label>
            <br>

            <input
                type="text"
                id="name"
                name="name"
                required
                aria-required="true"
            >

            <br><br>

            <label for="email">Email Address:</label>
            <br>

            <input
                type="email"
                id="email"
                name="email"
                required
                aria-required="true"
            >

        </fieldset>

        <br>

        <fieldset>

            <legend>ila inte ku qanacsantehe</legend>

            <input
                type="radio"
                id="very-satisfied"
                name="satisfaction"
                value="very-satisfied"
                required
            >
            <label for="very-satisfied">Aad ayaan ugu Qanacsanehe</label>

            <br>

            <input
                type="radio"
                id="satisfied"
                name="satisfaction"
                value="satisfied"
            >
            <label for="satisfied">wanku qanacsanehe</label>

            <br>

            <input
                type="radio"
                id="neutral"
                name="satisfaction"
                value="neutral"
            >
            <label for="neutral">dhexdhexad baan ahay</label>

            <br>

            <input
                type="radio"
                id="unsatisfied"
                name="satisfaction"
                value="unsatisfied"
            >
            <label for="unsatisfied">kuma qanacsani</label>

            <br>

        </fieldset>

        <br>

        <fieldset>

            <legend>Comments</legend>

            <label for="comments">kadhiibo rayigaga:</label>
            <br>

            <textarea
                id="comments"
                name="comments"
                rows="6"
                cols="40"
                minlength="10"
                required
                aria-required="true"
                aria-describedby="comments-help"
            ></textarea>

            <p id="comments-help">
                Please enter at least 10 characters.
            </p>

        </fieldset>

        <br>

        <button type="submit">Submit Feedback</button>

        <button type="reset">Clear Form</button>

    </form>
</body>
</html>
