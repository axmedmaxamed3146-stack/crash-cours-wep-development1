<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Cards</title>

    <link rel="stylesheet" href="./1.15 product cards.css">
</head>

<body>

    <h1 class="main-title">Our Product</h1>

    <div class="product-card">

        <div class="product-image">
            <img src="https://images.unsplash.com/photo-1730757679771-b53e798846cf?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D " alt="Rolex Submariner">
        </div>

        <div class="product-content">

            <h2>Rolex</h2>

            <p>
                Saacadda Rolex waa saacad qaali ah oo caan ka ah dunida.
                Waxay leedahay naqshad qurux badan oo casri ah, tayo sare
                iyo adkeysi wanaagsan. Rolex waxaa lasoo sarey sanadkii 1953.
                Waa saacad ku habboon qof kasta oo jecel qurux, iyo Tayo.
            </p>

            <p class="price">
                Price: $30,000
            </p>

            <div class="buttons">
                <button>Add to Cart</button>

                <button>Learn More</button>
            </div>

        </div>

    </div>
</body>
</html>
